[Unit]
Description=uWSGI instance to serve gbtalks
After=network.target

[Service]
User=gbtalks
Group=www-data
WorkingDirectory=/home/gbtalks/talks-processing
# The venv comes first so its tools (ffmpeg-normalize) win, but the system
# dirs have to be here too - the app shells out to ffmpeg and wodim.
Environment="PATH=/home/gbtalks/talks-processing/.ve/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
# Hand large files to nginx rather than pushing them through this single
# worker. Set here rather than in .env because it is a fact about running
# behind gbtalks-nginx, which is what this unit is, and .env is also read by
# the dev server - which has no nginx to hand anything to. load_dotenv does not
# override the environment, so this wins if .env ever says otherwise.
Environment="X_ACCEL_REDIRECT=1"
ExecStart=/home/gbtalks/talks-processing/.ve/bin/uwsgi --ini gbtalks.ini

[Install]
WantedBy=multi-user.target
