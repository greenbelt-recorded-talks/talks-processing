[Unit]
Description=uWSGI instance to serve gbtalks
After=network.target

[Service]
User=gbtalks
Group=www-data
WorkingDirectory=/home/gbtalks/talks-processing
# The venv comes first so its tools (ffmpeg-normalize) win, but the system
# dirs have to be here too - the app shells out to ffmpeg and wodim.
Environment="PATH=/home/gbtalks/talks-processing/.ve/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
ExecStart=/home/gbtalks/talks-processing/.ve/bin/uwsgi --ini gbtalks.ini

[Install]
WantedBy=multi-user.target
