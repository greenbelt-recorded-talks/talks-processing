---
- name: Install Server Packages
  hosts: localhost
  become_user: root
  become: true

  tasks:
    # Noble ships 3.12 and nothing newer, but CI and PythonAnywhere are both on
    # 3.13, so the app venv is built from deadsnakes. This deliberately does not
    # touch /usr/bin/python3 - Ubuntu's own tooling is built against 3.12 and
    # repointing it breaks apt. Only .ve/ moves.
    - name: Add the deadsnakes PPA
      ansible.builtin.apt_repository:
        repo: ppa:deadsnakes/ppa
        state: present
    - name: Ensure all system packages are installed
      ansible.builtin.apt:
        name: 
          - git
          - zsh
          - nginx
          - ffmpeg
          - htop
          - iotop
          - curl
          - nmap
          - npm
          - python3.13
          - python3.13-venv
          - python3.13-dev
          - gcc
          - python3-dev
          - libpcre3
          - libpcre3-dev
          - smartmontools
          - sqlite3
          - wodim
        state: latest
    - name: Create the gbtalks user
      ansible.builtin.user:
        name: gbtalks
        shell: /bin/zsh
        groups: syslog
        append: yes

- name: Mask unnecessary services
  hosts: localhost
  become_user: root
  become: true
  tasks:
    - name: Mask unnecessary services
      ansible.builtin.systemd_service:
        name: "{{ item }}"
        enabled: false
        masked: yes
      loop:
        - udisks2
        - bluetooth
        - sleep.target
        - suspend.target
        - hibernate.target
        - hybrid-sleep.target


- name: Set up the gbtalks user
  hosts: localhost
  become_user: root
  become: true

  roles:
    - role: gantsign.oh-my-zsh
      users:
        - username: gbtalks
          ohmyzsh:
            theme: powerlevel10k/powerlevel10k
    - role: diodonfrost.p10k
      p10k_users: 
        - gbtalks
      zsh_plugin: ohmyzsh
      # lean draws no segment backgrounds, so the prompt takes the colour
      # of whatever terminal you're sshing in from. classic hardcodes a
      # dark bar, which fights a light terminal.
      p10k_prompt_style: lean

  tasks:
    # Runs after the roles above, which is the point: the oh-my-zsh role
    # rewrites ~/.zshrc every run, so PATH cannot live there. ~/.zshenv is
    # untouched by it.
    - name: Put ~/.local/bin on PATH for zsh
      ansible.builtin.copy:
        src: gbtalks-zshenv
        dest: /home/gbtalks/.zshenv
        owner: gbtalks
        group: gbtalks
        mode: '0644'


- name: Install the talks-processing application
  hosts: localhost
  become_user: gbtalks
  become: true

  tasks:
    - name: Check out talks-processing repo
      ansible.builtin.git:
        repo: 'https://github.com/greenbelt-recorded-talks/talks-processing.git'
        dest: /home/gbtalks/talks-processing
    # The pip module creates a venv only when one is missing, so an existing
    # venv would silently stay on whatever Python built it. Check and discard.
    - name: Find the Python the venv was built with
      ansible.builtin.command:
        cmd: .ve/bin/python -c "import sys; print('%d.%d' % sys.version_info[:2])"
        chdir: /home/gbtalks/talks-processing
      register: venv_python
      failed_when: false
      changed_when: false
    # Deleting the venv out from under the running uwsgi is safe - it holds its
    # files open by inode - and the service is restarted later in this play.
    - name: Discard the venv if it is not on the target Python
      ansible.builtin.file:
        path: /home/gbtalks/talks-processing/.ve
        state: absent
      when: venv_python.rc | default(1) == 0 and venv_python.stdout | default('') | trim != '3.13'
    - name: Install Python requirements in venv
      ansible.builtin.pip:
        requirements: /home/gbtalks/talks-processing/requirements.txt
        virtualenv: /home/gbtalks/talks-processing/.ve
        virtualenv_command: python3.13 -m venv
    # Not in requirements.txt on purpose: PythonAnywhere supplies its own uWSGI
    # and the Dockerfile uses gunicorn, so only this deployment wants it. It
    # compiles from source, which is why the play installs gcc, python3.13-dev
    # and libpcre3-dev.
    - name: Install uWSGI in the venv
      ansible.builtin.pip:
        name: uwsgi
        virtualenv: /home/gbtalks/talks-processing/.ve
    - name: Configure the uwsgi service
      ansible.builtin.copy:
        src: gbtalks-uwsgi.conf
        dest: /etc/systemd/system/gbtalks.service
        owner: root
        group: root
        mode: '0644'
      become_user: root
      become: true
    - name: Create the uwsgi log directory
      ansible.builtin.file:
        path: /var/log/uwsgi
        state: directory
        owner: root
        group: gbtalks
        mode: '0775'
    - name: Create the uwsgi log file
      ansible.builtin.file:
        path: /var/log/uwsgi/gbtalks.log
        state: touch
        owner: gbtalks
        group: gbtalks
        mode: '0644'
    - name: Copy the nginx configuration
      ansible.builtin.copy:
        src: gbtalks-nginx
        dest: /etc/nginx/sites-available/gbtalks
        owner: root
        group: root
        mode: '0644'
      become_user: root
      become: true
    - name: Enable the site
      ansible.builtin.file:
        dest: /etc/nginx/sites-enabled/gbtalks
        src: /etc/nginx/sites-available/gbtalks
        state: link
        owner: root
        group: root
      become_user: root
      become: true
    - name: Start the gbtalks service
      ansible.builtin.service:
        name: gbtalks
        state: restarted
        enabled: true
      become_user: root
      become: true
    - name: Restart nginx
      ansible.builtin.service:
        name: nginx
        state: restarted
      become_user: root
      become: true
    - name: Set up conversion cron job
      ansible.builtin.cron:
        name: "Convert talks"
        minute: "*/5"
        job: "/home/gbtalks/talks-processing/conversion_cron.sh 2>&1 | logger -t gbtalks-conversion-cron"
    - name: Create the working directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: gbtalks
        group: gbtalks
        mode: '0775' 
      loop:
        - /storage
        - /storage/uploads
        - /storage/assets
        - /storage/processed
        - /storage/web_mp3s
        - /storage/usb_gold
        - /storage/cds
        - /usb_gold

- name: Serve DNS for the on-site network
  hosts: localhost
  become_user: root
  become: true

  tasks:
    # The config has to land before the package does. dnsmasq starts on
    # install, and the default config it ships binds port 53 on every
    # interface - that collides with systemd-resolved's stub on 127.0.0.53 and
    # fails the dpkg configure step, taking the playbook with it. Ours binds
    # eno1 only, so the first start is already the right one.
    - name: Create the dnsmasq config directory
      ansible.builtin.file:
        path: /etc/dnsmasq.d
        state: directory
        owner: root
        group: root
        mode: '0755'
    - name: Copy the dnsmasq configuration
      ansible.builtin.copy:
        src: gbtalks-dnsmasq.conf
        dest: /etc/dnsmasq.d/gbtalks.conf
        owner: root
        group: root
        mode: '0644'
    - name: Ensure dnsmasq is installed
      ansible.builtin.apt:
        name: dnsmasq
        state: latest
    - name: Start dnsmasq
      ansible.builtin.service:
        name: dnsmasq
        state: restarted
        enabled: true

- name: Set up backups
  hosts: localhost
  become_user: root
  become: true

  tasks:
    - name: Create the backup directory
      ansible.builtin.file:
        path: /storage/backups
        state: directory
        owner: gbtalks
        group: gbtalks
        mode: '0775'

