# Split-horizon DNS for the on-site festival network.
#
# Public DNS points on-site.talks-processing.greenbelt.org.uk at 10.70.7.229,
# which is not this machine and not reachable from here. Rather than wait on a
# change to the greenbelt.org.uk zone at Bytemark, answer for that name locally
# and forward everything else - including the bare talks-processing name, which
# must keep resolving to PythonAnywhere.

# Forward upstream. no-resolv is essential: without it dnsmasq reads
# /etc/resolv.conf, finds systemd-resolved's stub on 127.0.0.53, and loops.
# These are public resolvers rather than the venue's DHCP-supplied ones so the
# file survives being moved between networks - swap them if on-site clients
# need to resolve venue-internal names.
no-resolv
server=1.1.1.1
server=8.8.8.8

# Bind only this interface, leaving 127.0.0.53 to systemd-resolved. The host
# itself keeps resolving through resolved and is unaffected by any of this.
bind-interfaces
interface=eno1

# Answer with whatever address eno1 currently holds, rather than a hardcoded
# one - the lease is dynamic, and this file is in a public repo.
#
# Only the on-site name is intercepted. talks-processing.greenbelt.org.uk is
# deliberately left to forward upstream so the PythonAnywhere instance stays
# reachable from the same clients. interface-name matches exactly and does not
# cover subdomains the way address=/domain/ does, which is what makes that
# split possible.
interface-name=on-site.talks-processing.greenbelt.org.uk,eno1

domain-needed
bogus-priv
cache-size=1000
